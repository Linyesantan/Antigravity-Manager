name: Local Manual Pause Fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev pkg-config cmake clang libclang-dev ninja-build
      - name: Reuse exact version frontend
        run: |
          docker pull lbjlaq/antigravity-manager:v5.0.2-beta.9
          container=$(docker create lbjlaq/antigravity-manager:v5.0.2-beta.9)
          docker cp "$container:/app/dist" dist
          docker rm "$container"
      - name: Test pause and credential preservation
        working-directory: src-tauri
        run: cargo test --locked --lib manual_pause_preserves_credentials_and_blocks_background_access -- --test-threads=1
      - name: Build patched backend
        working-directory: src-tauri
        run: cargo build --locked --release --bin antigravity-tools
      - uses: actions/upload-artifact@v4
        with:
          name: patched-backend
          path: src-tauri/target/release/antigravity-tools
          retention-days: 2
